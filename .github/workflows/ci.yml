name: CI

on:
  push:
    # The branch this repository actually has. It was `main` here and `master`
    # in the repository, so no push ever matched and the CI had never run once:
    # zero executions across the whole history. Both are listed because the one
    # thing worse than the wrong name is the wrong name again after a rename.
    branches: [master, main]
    # Nothing in this pipeline reads a Markdown file: no install rule packages
    # one, no test asserts on one, and the only `.md` the build mentions at all
    # is a path inside an error message. A change that touches nothing else has
    # nothing here that could fail, and spending three platforms, a sanitizer
    # run and a static analysis on it is time the next real change spends
    # queueing behind it.
    #
    # The filter drops the run only when every changed file matches, so a commit
    # that edits a header and the page documenting it still runs in full. That
    # is the property worth keeping: the risk of a filter like this is never the
    # documentation, it is the source change that rides along with it.
    #
    # workflow_dispatch stays unfiltered on purpose. A manual run is somebody
    # asking for the pipeline, and what changed is not the question.
    #
    # One thing to remember before any of these becomes a required check: a run
    # that never starts reports nothing, and a required check that reports
    # nothing blocks the pull request forever. The branch is unprotected today,
    # which is the only reason this is a filter and not a gate job.
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which halves of the repository moved, so that a change to one of them does
  # not spend the other one's minutes.
  #
  # The Go module under tools/dbadmin builds, lints and tests entirely on its
  # own: nothing in the C++ pipeline compiles a line of it, and nothing in it
  # reads a line of C++. A commit that only touches it was costing fifteen
  # minutes of Windows, nine of static analysis and six of MongoDB to prove
  # something none of them can see.
  #
  # A gate job rather than a second `paths-ignore`, which is per workflow and
  # would take the Go job down with the rest. The trade the filter at the top
  # of this file warns about does not apply here, for the opposite reason: a
  # job skipped by `if` reports itself as skipped, where a run that never
  # starts reports nothing at all. This is the shape that could survive the
  # branch becoming protected.
  #
  # Everything below fails towards running. An unrecognised event, a diff that
  # does not resolve, a branch with no previous commit: all of them run the
  # whole pipeline. A wrong "run" costs minutes and a wrong "skip" hides a
  # break, and those are not the same mistake.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      cpp: ${{ steps.what.outputs.cpp }}
      go: ${{ steps.what.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs both ends of it, and the default checkout has the
          # tip with nothing behind it to compare against.
          fetch-depth: 0

      - name: Work out what moved
        id: what
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          everything() {
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "running everything: $1"
            exit 0
          }

          case "$EVENT" in
            pull_request)
              range="origin/$BASE_REF...HEAD"
              ;;
            push)
              # Forty zeroes on the first push of a branch: there is no earlier
              # commit for the diff to start from.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                everything "a branch with no previous commit"
              fi
              range="$BEFORE..HEAD"
              ;;
            *)
              everything "$EVENT is somebody asking for the pipeline"
              ;;
          esac

          changed=$(git diff --name-only "$range") || everything "the diff did not resolve"
          if [ -z "$changed" ]; then
            everything "nothing resolved as changed"
          fi
          echo "changed:"
          echo "$changed" | sed 's/^/  /'

          # Anything outside the Go module can reach the C++ build, this file
          # included: a change to the pipeline has to be run to be trusted.
          if printf '%s\n' "$changed" | grep -qv '^tools/dbadmin/'; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "cpp=false" >> "$GITHUB_OUTPUT"
          fi

          # The Go job runs for its own module, and for a change to the
          # workflow that runs it.
          if printf '%s\n' "$changed" | grep -qE '^(tools/dbadmin/|[.]github/)'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
            /usr/bin/clang-format-18 100

      - name: Check formatting
        run: |
          find shared client server tests tools \
            \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      # The workflows are the part of this repository that cannot be run before
      # it is merged, and the release ones cannot be run at all outside a tag.
      # actionlint is the only thing standing between a typo and a burnt tag: it
      # is what caught a signing guard reading a context a step cannot see, a
      # publish condition that was always true, and a runner label that no
      # longer exists.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # The database tool is a Go module of its own, so nothing in the C++ jobs
  # above compiles it, lints it or runs its tests. It talks to MongoDB and it
  # writes credentials the server has to be able to verify, which is the one
  # thing here that can break silently in two places at once: a cost parameter
  # changed in the tool locks every account out of the server, and the test
  # that catches it needs a database to run against.
  dbadmin:
    name: Database tool
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true'
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        # Without a health check the job races the container: the driver gives
        # up after its short timeout and every database test fails against a
        # server that was seconds away from being ready.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tools/dbadmin
    steps:
      - uses: actions/checkout@v4

      # The version the module asks for, read from the module itself, so that
      # the toolchain here and the one on a development machine cannot drift
      # apart without go.mod saying so.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/dbadmin/go.mod
          cache-dependency-path: tools/dbadmin/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Under the race detector because the screens read the database from
      # commands that run on their own goroutines, which is where a race would
      # be, and it costs seconds on a suite this size.
      - name: Tests
        run: go test -race ./...
        env:
          DBADMIN_TEST_MONGO_URI: mongodb://127.0.0.1:27017

  # Packaging breaks quietly: an install rule that stops covering a file, or a
  # script that stops finding one, produces a green build and an artefact
  # missing something. This is the cheap half of the release pipeline, run on
  # every change, without the media layer so it does not need libwebrtc.
  packaging:
    name: Packaging
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev \
            libxrandr-dev libxcomposite-dev libxtst-dev desktop-file-utils

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-ubuntu-24.04-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-ubuntu-24.04-

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh
        shell: bash

      - name: Configure
        run: >
          cmake -S . -B build/packaging -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$DV_VCPKG_TOOLCHAIN"
          -DCMAKE_BUILD_TYPE=Release
          -DDV_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/packaging

      - name: Install
        run: cmake --install build/packaging --prefix "$PWD/stage"

      # Named one by one rather than counted. A missing icon size is invisible
      # until a desktop picks that size, and "there were nine files" is a check
      # that passes when the wrong nine are there.
      - name: The install tree has what an artefact needs
        run: |
          set -euo pipefail
          expected="
            bin/partyshare
            bin/partyshare-server
            share/applications/partyshare.desktop
            share/icons/hicolor/scalable/apps/partyshare.svg
          "
          for size in 16 24 32 48 64 128 256 512; do
            expected="$expected share/icons/hicolor/${size}x${size}/apps/partyshare.png"
          done
          missing=0
          for file in $expected; do
            if [ ! -f "stage/$file" ]; then
              echo "::error::the install tree is missing $file"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          desktop-file-validate stage/share/applications/partyshare.desktop

      - name: CPack produces an archive
        run: |
          set -euo pipefail
          cd build/packaging
          cpack -G TGZ -B package
          # Listed to a file rather than piped into grep: `grep -q` stops at the
          # first match and closes the pipe, tar dies of EPIPE, and pipefail
          # turns a passing check into a failing job.
          tar tzf package/partyshare-*-linux-x64.tar.gz > contents.txt
          grep -q 'bin/partyshare$' contents.txt
          grep -q 'bin/partyshare-server$' contents.txt
          grep -q 'share/applications/partyshare.desktop$' contents.txt

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            preset: linux-release
          - name: Windows x64
            os: windows-2022
            preset: windows-release
          - name: macOS ARM64
            os: macos-14
            preset: macos-arm64-release

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev \
            libxrandr-dev libxcomposite-dev libxtst-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh
        shell: bash

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_TOOLCHAIN_FILE="$DV_VCPKG_TOOLCHAIN"
        shell: bash

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Tests
        run: ctest --preset ${{ matrix.preset }}

      # ctest fails a run with no tests in it, and passes a run that lost half
      # of them. On Windows the unit binary linked a second copy of GoogleTest
      # through gmock and registered every TEST() into a registry main() never
      # read: it ran, said "does NOT link in any test case", and exited 0. The
      # step above reported 63 of 63 passing while 272 unit tests were absent,
      # because the integration binary kept the total above zero. Counting per
      # label is what turns that back into a red job. Entry 11 of docs/postmortems.md.
      - name: Both halves of the suite have to be there
        shell: bash
        run: |
          for label in unit integration; do
            found=$(ctest --test-dir "build/${{ matrix.preset }}" -N -L "$label" |
                    sed -n 's/^Total Tests: //p')
            echo "$label: ${found:-0}"
            if [ "${found:-0}" -lt 1 ]; then
              echo "::error::no $label tests were discovered, so none of them ran"
              exit 1
            fi
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.preset }}/bin/
          retention-days: 7

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh
        shell: bash

      # Only the Qt interface is skipped, because Qt is not built with
      # sanitizers. The client core is built and covered: it has no Qt in it,
      # and it is where the threading that ASan and UBSan are for lives.
      - name: Configure
        run: |
          cmake -S . -B build/asan -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DV_VCPKG_TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDV_ENABLE_SANITIZERS=ON \
            -DDV_WARNINGS_AS_ERRORS=ON \
            -DDV_BUILD_CLIENT_UI=OFF

      - name: Build
        run: cmake --build build/asan

      # Covers the signaling server's threading too: the integration tests bind
      # real sockets and run the heartbeat thread, and the client core's, which
      # is where the frame queue and the call session run.
      - name: Tests
        run: ctest --test-dir build/asan --output-on-failure

  # MongoDB persistence had no job at all, so tests/integration/test_mongo_store.cpp
  # was never compiled here, let alone run: DV_ENABLE_MONGO is off by default
  # and nothing turned it on. The mongo:7 service further up belongs to the Go
  # database tool and does not reach the C++ suite. An edit to that file could
  # therefore be merged green without a compiler having read it.
  #
  # Its own job rather than a flag on the Linux build, because the driver is a
  # long source build that the other jobs should not wait on, and because
  # DV_ENABLE_MONGO changes what dv_server_core links: keeping the ordinary
  # build free of it is what proves the server still builds without a database.
  mongo:
    name: MongoDB persistence
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        # The same health check as the database tool job, for the same reason:
        # without one the job races the container and the driver gives up on a
        # server that was seconds from being ready.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      # A key of its own, because this is the only job whose vcpkg tree holds
      # the driver, and it falls back to the shared one so that a first run
      # starts from the dependencies every other job already built.
      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-mongo-ubuntu-24.04-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-mongo-ubuntu-24.04-
            vcpkg-ubuntu-24.04-

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh
        shell: bash

      # No client: Qt is minutes of build time and nothing in the database
      # layer or its tests touches it.
      - name: Configure
        run: >
          cmake -S . -B build/mongo -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$DV_VCPKG_TOOLCHAIN"
          -DCMAKE_BUILD_TYPE=Release
          -DDV_WARNINGS_AS_ERRORS=ON
          -DDV_ENABLE_MONGO=ON
          -DVCPKG_MANIFEST_FEATURES=mongo
          -DDV_BUILD_CLIENT=OFF

      - name: Build
        run: cmake --build build/mongo

      - name: Tests
        run: ctest --test-dir build/mongo --output-on-failure --no-tests=error -L mongo | tee mongo-tests.log
        shell: bash
        env:
          DV_TEST_MONGO_URI: mongodb://127.0.0.1:27017

      # A mongo test with no DV_TEST_MONGO_URI skips itself, and ctest counts a
      # skip as a pass. A job that never reached the database would therefore be
      # green having verified nothing, which is entry 11 of docs/postmortems.md
      # wearing a different hat and is guarded the same way.
      - name: The tests reached the database instead of skipping themselves
        shell: bash
        run: |
          if grep -q 'Skipped' mongo-tests.log; then
            echo "::error::the mongo tests skipped themselves, so DV_TEST_MONGO_URI never reached them"
            exit 1
          fi
          echo "no test skipped, so every one of them spoke to the database"

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          # libgl and the xcb libraries are here for Qt: find_package(Qt6) is
          # QUIET, so without them the interface would be dropped from the
          # database without a word, and the analysis would quietly cover less
          # than it claims.
          sudo apt-get install -y clang-18 clang-tidy-18 cppcheck ninja-build \
            libx11-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      # The interface is analysed too, so the database has to describe it, which
      # means Qt has to be here.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh
        shell: bash

      # Built with clang, because clang-tidy is clang and reads these flags back
      # verbatim. Qt's imported targets carry -mno-direct-extern-access under
      # GCC, which clang does not know, and one unknown flag ends the run before
      # a single check has a chance to say anything.
      - name: Generate the compilation database
        run: |
          cmake -S . -B build/analysis -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DV_VCPKG_TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18

      # Everything that is ours, interface included. The Qt idiom the checks
      # cannot read about is answered in client/src/ui/.clang-tidy, not by
      # leaving the directory unanalysed.
      #
      # client/src/webrtc is the exception, and not a preference: it compiles
      # only with libwebrtc, which this job does not build, so those files have
      # no entry in the database and clang-tidy would have nothing to read.
      - name: clang-tidy
        run: |
          # server/src/store/mongo_store.cpp is left out for the same reason
          # client/src/webrtc is: it only compiles where its library exists,
          # and this job builds without MongoDB. Analysing it here does not
          # find problems, it finds bsoncxx headers that are not installed.
          #
          # run-clang-tidy rather than clang-tidy: the file list fits in one
          # command line, so xargs made a single invocation and clang-tidy
          # walked the files one after another while three of the runner's four
          # cores watched. This step was six minutes of the job's ten.
          #
          # It also serialises the output per file, which xargs -P would not:
          # parallel clang-tidy processes writing at once interleave their
          # diagnostics, and a finding split across another file's notes is a
          # finding nobody reads.
          #
          # The arguments are regexes matched against the compilation database,
          # not paths, but a path is a regex that matches itself.
          find shared server client/src -name '*.cpp' \
            -not -path 'client/src/webrtc/*' \
            -not -path 'server/src/store/mongo_store.cpp' \
            -print0 | xargs -0 run-clang-tidy-18 -p build/analysis -j "$(nproc)"

      - name: cppcheck
        run: |
          # DV_VERSION reaches the compiler as a CMake compile definition, so
          # cppcheck has to be told about it as well. Without it the analysis
          # stops at the first --help string with "unknown macro", which is
          # what it had been doing: this job has never once got past it.
          # Read from the one place the version lives, so it cannot drift.
          version=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          test -n "$version"

          # mongo_store.cpp is excluded here too, and for the same reason as
          # in the clang-tidy step above.
          cppcheck --enable=warning,performance,portability \
            --std=c++20 --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem \
            -DDV_VERSION="\"$version\"" \
            -i server/src/store/mongo_store.cpp \
            -I shared/include -I server/src -I client/src \
            shared/src server/src \
            client/src/app client/src/media client/src/network client/src/video

  # The M3 spike is not part of the product build. It runs on demand so the
  # libwebrtc toolchain can be validated on every platform without adding a
  # multi hundred megabyte download to every push.
  media:
    name: Audio pipeline (Linux x64)
    # Needs the libwebrtc tree that scripts/build_webrtc.sh produces, which is a
    # 30 GB checkout and tens of minutes of compiling, so this does not run on
    # every push. The cache below makes the second run cheap.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpipewire-0.3-dev and libasound2-dev are named here because the
          # build needs them, not because the runner lacks them.
          # scripts/build_webrtc.sh turns on rtc_use_pipewire, so gn resolves
          # pkg_config("pipewire") in //modules/portal and fails gn gen without
          # the first; libwebrtc compiles its ALSA backend unconditionally on
          # Linux and needs alsa/asoundlib.h from the second.
          #
          # Both were invisible while the libwebrtc cache kept hitting, because
          # a cache hit skips the build step that needs them. The first cache
          # miss is what asks the question, and a dependency that only the
          # runner image happens to answer is one that disappears when the
          # image changes.
          sudo apt-get install -y clang libx11-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libglib2.0-dev libgbm-dev libdrm-dev libpipewire-0.3-dev \
            libasound2-dev libssl-dev pulseaudio pulseaudio-utils

      - name: Restore the libwebrtc build
        id: webrtc-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/partyshare/webrtc/dist
          key: webrtc-ubuntu-24.04-x64-${{ hashFiles('scripts/build_webrtc.sh', 'patches/webrtc/**') }}

      # --ssl-root, because dv_media_tests links dv_server_core, which links
      # OpenSSL::Crypto, and a libwebrtc carrying its own BoringSSL then puts
      # two definitions of SSL_new and several hundred of its neighbours in one
      # binary. GNU ld calls that "multiple definition" and stops.
      #
      # The system headers rather than vcpkg's: this step runs before vcpkg is
      # prepared, and it only needs the declarations. Which OpenSSL is actually
      # linked is the consumer's decision, which is the whole point of the flag.
      - name: Build libwebrtc
        if: steps.webrtc-cache.outputs.cache-hit != 'true'
        run: scripts/build_webrtc.sh --out ~/.cache/partyshare/webrtc --ssl-root /usr/include

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh
        shell: bash

      - name: Configure
        run: |
          cmake -S . -B build/media -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DV_VCPKG_TOOLCHAIN" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDV_BUILD_CLIENT_MEDIA=ON \
            -DDV_WEBRTC_ROOT="$HOME/.cache/partyshare/webrtc/dist"

      - name: Build
        run: cmake --build build/media --target dv_media_tests

      # No sound card on a runner, so one is made. The tests then run on real
      # captured samples instead of on silence, which is the only way the level
      # and speaking assertions mean anything.
      - name: Tests
        run: |
          eval "$(scripts/virtual_audio.sh start)"
          ctest --test-dir build/media -L media --output-on-failure
          scripts/virtual_audio.sh stop

  # Reports, does not gate. The spike answers "does this libwebrtc link and run
  # here" before the project commits to it, and that answer is worth having -
  # but it is broken on all three platforms for three unrelated reasons, none
  # of which is about the code this repository writes:
  #
  #   Linux    the pinned Chromium libc++ uses __builtin_clzg and friends,
  #            which are Clang 19 builtins. The runner installs the distro
  #            clang, which is 18. Consuming the prebuilt archive needs
  #            Chromium's own clang, and that only arrives with the 30 GB
  #            depot_tools checkout scripts/build_webrtc.sh makes.
  #
  #   Windows  the job asks for the /MT package through
  #            DV_WEBRTC_WINDOWS_DYNAMIC_CRT=OFF and CMake compiles the spike
  #            /MD, so the link stops on a RuntimeLibrary mismatch. This was
  #            invisible until the shell fix below, because the flags never
  #            reached CMake and the dynamic package matched /MD by accident.
  #
  #   macOS    the block in Findlibwebrtc.cmake that applies Chromium's libc++
  #            sits inside the Linux branch, after the portal pkg_check_modules,
  #            so it never runs. The archive is built against std::__Cr and the
  #            consumer against std::__1, and the link finds neither
  #            CreatePeerConnectionFactory nor Thread::SetName.
  #
  # Each one needs a machine to verify a fix on, and fixing them is its own
  # piece of work rather than a step in somebody else's. Until then a red spike
  # would only teach people to ignore a red CI, which costs more than the job
  # is worth. It still runs, and it still says what it found.
  webrtc-spike:
    name: libwebrtc spike (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2022
          - name: macOS ARM64
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # The portal group is not optional even though nothing here shares a
          # screen. Findlibwebrtc.cmake compiles every Linux consumer with
          # WEBRTC_USE_PIPEWIRE, so it demands glib, gio, gobject, gbm and
          # libdrm through pkg_check_modules, and the configure stops there.
          sudo apt-get update
          sudo apt-get install -y clang libx11-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev \
            libglib2.0-dev libgbm-dev libdrm-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          # The server is off for the same reason the client is: this job
          # installs no vcpkg, so libdatachannel is not here, and
          # Dependencies.cmake demands it whenever either of the two is on.
          # Without this the configure failed on all three platforms before it
          # ever reached find_package(libwebrtc), which is to say the spike had
          # never once run here. The CMake error even named the fix.
          #
          # DV_WEBRTC_WINDOWS_DYNAMIC_CRT is off because the spike is the one
          # consumer that still wants the published /MT package. The default is
          # on, and points at the tree built for the client, which expects an
          # external OpenSSL this job has no vcpkg to bring. Read only on Windows
          # and ignored on the other two platforms.
          cmake -S . -B build/spike -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDV_ENABLE_WEBRTC_SPIKE=ON \
            -DDV_WEBRTC_WINDOWS_DYNAMIC_CRT=OFF \
            -DDV_BUILD_CLIENT=OFF \
            -DDV_BUILD_SERVER=OFF \
            -DDV_BUILD_TESTS=OFF
        # bash on every platform, including Windows, where the default is
        # PowerShell and the backslashes below are not line continuations. Only
        # the first line ran there, so the configure went ahead with none of
        # these flags: DV_BUILD_CLIENT stayed on, Dependencies.cmake asked for
        # a libdatachannel this job never installs, and the error named that
        # rather than the shell. PowerShell then reported the second line as an
        # unknown command, which is the only clue that the two were ever meant
        # to be one.
        shell: bash
        env:
          CXX: ${{ runner.os == 'Linux' && 'clang++' || '' }}

      - name: Build
        run: cmake --build build/spike

      - name: Run
        run: ./build/spike/bin/webrtc-spike
