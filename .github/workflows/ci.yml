name: CI

on:
  push:
    # The branch this repository actually has. It was `main` here and `master`
    # in the repository, so no push ever matched and the CI had never run once:
    # zero executions across the whole history. Both are listed because the one
    # thing worse than the wrong name is the wrong name again after a rename.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
            /usr/bin/clang-format-18 100

      - name: Check formatting
        run: |
          find shared client server tests tools \
            \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      # The workflows are the part of this repository that cannot be run before
      # it is merged, and the release ones cannot be run at all outside a tag.
      # actionlint is the only thing standing between a typo and a burnt tag: it
      # is what caught a signing guard reading a context a step cannot see, a
      # publish condition that was always true, and a runner label that no
      # longer exists.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # Packaging breaks quietly: an install rule that stops covering a file, or a
  # script that stops finding one, produces a green build and an artefact
  # missing something. This is the cheap half of the release pipeline, run on
  # every change, without the media layer so it does not need libwebrtc.
  packaging:
    name: Packaging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev \
            libxrandr-dev libxcomposite-dev libxtst-dev desktop-file-utils

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-ubuntu-24.04-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-ubuntu-24.04-

      - name: Configure
        run: >
          cmake -S . -B build/packaging -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DDV_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/packaging

      - name: Install
        run: cmake --install build/packaging --prefix "$PWD/stage"

      # Named one by one rather than counted. A missing icon size is invisible
      # until a desktop picks that size, and "there were nine files" is a check
      # that passes when the wrong nine are there.
      - name: The install tree has what an artefact needs
        run: |
          set -euo pipefail
          expected="
            bin/partyshare
            bin/partyshare-server
            share/applications/partyshare.desktop
            share/icons/hicolor/scalable/apps/partyshare.svg
          "
          for size in 16 24 32 48 64 128 256 512; do
            expected="$expected share/icons/hicolor/${size}x${size}/apps/partyshare.png"
          done
          missing=0
          for file in $expected; do
            if [ ! -f "stage/$file" ]; then
              echo "::error::the install tree is missing $file"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          desktop-file-validate stage/share/applications/partyshare.desktop

      - name: CPack produces an archive
        run: |
          set -euo pipefail
          cd build/packaging
          cpack -G TGZ -B package
          tar tzf package/partyshare-*-linux-x64.tar.gz | grep -q 'bin/partyshare$'

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            preset: linux-release
          - name: Windows x64
            os: windows-2022
            preset: windows-release
          - name: macOS ARM64
            os: macos-14
            preset: macos-arm64-release

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev \
            libxrandr-dev libxcomposite-dev libxtst-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        shell: bash

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Tests
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.preset }}/bin/
          retention-days: 7

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      # Only the Qt interface is skipped, because Qt is not built with
      # sanitizers. The client core is built and covered: it has no Qt in it,
      # and it is where the threading that ASan and UBSan are for lives.
      - name: Configure
        run: |
          cmake -S . -B build/asan -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDV_ENABLE_SANITIZERS=ON \
            -DDV_WARNINGS_AS_ERRORS=ON \
            -DDV_BUILD_CLIENT_UI=OFF

      - name: Build
        run: cmake --build build/asan

      # Covers the signaling server's threading too: the integration tests bind
      # real sockets and run the heartbeat thread, and the client core's, which
      # is where the frame queue and the call session run.
      - name: Tests
        run: ctest --test-dir build/asan --output-on-failure

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 cppcheck ninja-build libx11-dev

      - name: Generate the compilation database
        run: |
          cmake -S . -B build/analysis -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DDV_BUILD_CLIENT_UI=OFF

      # The client core is analysed too. It has no Qt in it, which is why the
      # interface is the only thing turned off above, and it is where the
      # threading lives.
      - name: clang-tidy
        run: |
          find shared server \
            client/src/app client/src/media client/src/network client/src/video \
            -name '*.cpp' -print0 | xargs -0 clang-tidy-18 -p build/analysis

      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
            --std=c++20 --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem \
            -I shared/include -I server/src -I client/src \
            shared/src server/src \
            client/src/app client/src/media client/src/network client/src/video

  # The M3 spike is not part of the product build. It runs on demand so the
  # libwebrtc toolchain can be validated on every platform without adding a
  # multi hundred megabyte download to every push.
  media:
    name: Audio pipeline (Linux x64)
    # Needs the libwebrtc tree that scripts/build_webrtc.sh produces, which is a
    # 30 GB checkout and tens of minutes of compiling, so this does not run on
    # every push. The cache below makes the second run cheap.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libx11-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libglib2.0-dev libgbm-dev libdrm-dev \
            pulseaudio pulseaudio-utils

      - name: Restore the libwebrtc build
        id: webrtc-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/partyshare/webrtc/dist
          key: webrtc-linux-x64-${{ hashFiles('scripts/build_webrtc.sh', 'patches/webrtc/**') }}

      - name: Build libwebrtc
        if: steps.webrtc-cache.outputs.cache-hit != 'true'
        run: scripts/build_webrtc.sh --out ~/.cache/partyshare/webrtc

      - name: Configure
        run: |
          cmake -S . -B build/media -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDV_BUILD_CLIENT_MEDIA=ON \
            -DDV_WEBRTC_ROOT="$HOME/.cache/partyshare/webrtc/dist"

      - name: Build
        run: cmake --build build/media --target dv_media_tests

      # No sound card on a runner, so one is made. The tests then run on real
      # captured samples instead of on silence, which is the only way the level
      # and speaking assertions mean anything.
      - name: Tests
        run: |
          eval "$(scripts/virtual_audio.sh start)"
          ctest --test-dir build/media -L media --output-on-failure
          scripts/virtual_audio.sh stop

  webrtc-spike:
    name: libwebrtc spike (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2022
          - name: macOS ARM64
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libx11-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          cmake -S . -B build/spike -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDV_ENABLE_WEBRTC_SPIKE=ON \
            -DDV_BUILD_CLIENT=OFF \
            -DDV_BUILD_TESTS=OFF
        env:
          CXX: ${{ runner.os == 'Linux' && 'clang++' || '' }}

      - name: Build
        run: cmake --build build/spike

      - name: Run
        run: ./build/spike/bin/webrtc-spike
