name: Release

# Tasks 5 of the M9: a tag produces the artefacts, and nobody uploads a file by
# hand. A release built from a laptop is a release whose contents nobody can
# reconstruct, and the first time that matters is when a user reports a crash in
# a build that no longer exists anywhere.
#
# workflow_dispatch is here so the pipeline can be exercised without cutting a
# tag. It builds everything and uploads nothing, because a release without a tag
# has no version to be.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64 AppImage
    # Off for now, and the job is kept rather than deleted because nothing in it
    # is known to be wrong. scripts/build_webrtc.sh cannot get past the
    # depot_tools CIPD bootstrap on a runner - curl gets a 403 one second in,
    # before a byte of WebRTC is fetched - and without libwebrtc there is no
    # AppImage.
    #
    # A repository variable rather than `if: false`, which actionlint rejects as
    # a constant condition, and rightly: a switch that can only be flipped by
    # editing the workflow is not a switch. RELEASE_LINUX is unset today, so this
    # job does not run. Set it to 'true' under Settings > Secrets and variables >
    # Actions > Variables to turn it back on, once the bootstrap is fixed.
    if: vars.RELEASE_LINUX == 'true'
    # The oldest runner available, deliberately. glibc is the one thing an
    # AppImage cannot carry, so the build machine's glibc is the floor for every
    # machine that can run the result.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev \
            libxrandr-dev libxcomposite-dev libxtst-dev \
            desktop-file-utils zsync

      # libdatachannel is the one dependency with no FetchContent fallback, so
      # Dependencies.cmake stops the configure outright when it is absent. The
      # Windows and macOS jobs below have always prepared vcpkg and this one
      # never did, which made the tag that first exercised this pipeline the
      # thing that found out.
      #
      # Before libwebrtc rather than after it. This step is a couple of minutes
      # and the one below is a 30 GB checkout, so putting the cheap failure
      # first is the difference between learning that vcpkg is broken now and
      # learning it at the end of an afternoon of compiling.
      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-ubuntu-22.04-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-ubuntu-22.04-

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh

      - name: Restore the libwebrtc cache
        id: webrtc-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/partyshare/webrtc/dist
          key: webrtc-ubuntu-22.04-x64-${{ hashFiles('scripts/build_webrtc.sh', 'patches/webrtc/**') }}

      - name: Build libwebrtc
        if: steps.webrtc-cache.outputs.cache-hit != 'true'
        run: scripts/build_webrtc.sh --out ~/.cache/partyshare/webrtc

      - name: Build the AppImage
        run: scripts/appimage.sh

      # An artefact that has never been started is an artefact nobody knows is
      # broken. This is the same check that found the first AppImage shipping
      # without a media layer, which started fine and could not make a call.
      - name: Smoke test
        run: |
          sudo apt-get install -y xvfb
          APPIMAGE=$(ls build/appimage/partyshare-*.AppImage)
          export APPIMAGE_EXTRACT_AND_RUN=1
          output=$(timeout 60 xvfb-run -a "$APPIMAGE" 2>&1 || true)
          echo "$output"
          grep -q "PartyShare client ready" <<<"$output" \
            || { echo "::error::the client never reported itself ready"; exit 1; }
          if grep -q "no media layer" <<<"$output"; then
            echo "::error::built without the media layer, so it cannot make calls"
            exit 1
          fi

      # The second acceptance criterion of the milestone: the artefact runs on a
      # machine that is not the one that built it. A container of a different
      # distribution is the closest thing to that a pipeline can produce, and it
      # is a real test here because the job builds on 22.04 and this is 24.04.
      #
      # The packages are the libraries the AppImage deliberately does not carry.
      # Bundling fontconfig makes an application stop finding the host's fonts,
      # and bundling the graphics stack makes it stop finding the host's driver,
      # so both are expected from the system. The list is what every desktop
      # already has, and installing it explicitly is what keeps it honest: a
      # dependency that creeps in outside this list will fail here.
      - name: Clean machine test
        run: |
          docker run --rm -v "$PWD/build/appimage:/art:ro" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends               libx11-6 libx11-xcb1 libxcb1 libice6 libsm6               libegl1 libglx0 libopengl0 libdrm2 libgbm1               libfontconfig1 libfreetype6 libharfbuzz0b xvfb
            cp /art/partyshare-*.AppImage /tmp/app && chmod +x /tmp/app
            export APPIMAGE_EXTRACT_AND_RUN=1
            output=$(timeout 60 xvfb-run -a /tmp/app 2>&1 || true)
            echo "$output"
            grep -q "PartyShare client ready" <<<"$output" || {
              echo "the AppImage does not start on a clean Ubuntu 24.04"
              exit 1
            }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/appimage/partyshare-*.AppImage
            build/appimage/partyshare-*.AppImage.zsync
          retention-days: 7

  # The Windows and macOS artefacts, tasks 1, 3 and 4. Both jobs are written and
  # neither has ever run: this repository is developed on Linux, and the two
  # were derived from the platform tooling's documentation rather than from a
  # build that produced a file somebody installed. Treat the first run as the
  # thing that finds out what is wrong with them, not as a regression.
  #
  # Signing is conditional on the secrets existing rather than assumed, so that
  # a fork and a first tag both produce unsigned artefacts instead of a failed
  # pipeline. An unsigned build is a build the operating system warns about, and
  # that is a better failure than no build.
  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    # Lifted to the job because a step's if: cannot read the secrets context,
    # and can read env. A guard that never fires would sign nothing and say
    # nothing, which is the failure mode worth designing against here.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # CPack shells out to candle.exe and light.exe and reports their absence
      # as a generator that produced nothing, which reads like a configuration
      # mistake rather than a missing program. The runner image has carried WiX
      # 3 for years; looking before installing keeps the job cheap today and
      # working on the day the image drops it.
      - name: Install the WiX Toolset
        shell: pwsh
        run: |
          function Find-Candle {
            Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3.*\bin\candle.exe' `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $candle = Find-Candle
          if (-not $candle) {
            choco install wixtoolset --no-progress -y
            $candle = Find-Candle
          }
          if (-not $candle) { throw 'WiX 3 is not on this machine and could not be installed' }
          # CPack looks for the toolset through the WIX environment variable
          # before it looks anywhere else, and choco sets that variable in a
          # registry the already running job never re-reads.
          $root = $candle.Directory.Parent.FullName
          Write-Host "WiX: $root"
          Add-Content $env:GITHUB_ENV "WIX=$root\"
          Add-Content $env:GITHUB_PATH $candle.Directory.FullName

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-windows-2022-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-2022-

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh
        shell: bash

      # Client only. What a Windows machine installs from a desktop MSI is the
      # application; the server is a Linux daemon and shipping its executable
      # inside a start menu entry only raises the question of what to do with
      # it. Leaving it out of the build is also what keeps it out of the ZIP,
      # which is packed from the same install tree.
      #
      # DV_BUILD_CLIENT_MEDIA is the whole difference between an installer and
      # an installer that can make a call. It defaults to OFF, and every MSI
      # this pipeline published up to v0.1.3 was built without it: the client
      # started, connected, joined a room and answered every attempt to speak
      # with "This build was compiled without audio and video", which is what
      # media/media_session.cpp returns when the stub is the only
      # create_media_session in the binary.
      #
      # It is not free to turn on. libwebrtc is fetched by
      # cmake/Findlibwebrtc.cmake, and on Windows the published package is
      # built against the static CRT while Qt and everything from vcpkg is
      # dynamic; DV_WEBRTC_WINDOWS_DYNAMIC_CRT, on by default, is what points
      # the fetch at a tree the client can actually link. The download is
      # around 100 MB and the archive expands to a 340 MB static library.
      - name: Configure
        run: >
          cmake --preset windows-release
          -DCMAKE_TOOLCHAIN_FILE="$DV_VCPKG_TOOLCHAIN"
          -DDV_BUILD_TESTS=OFF
          -DDV_BUILD_SERVER=OFF
          -DDV_BUILD_CLIENT_MEDIA=ON
        shell: bash

      - name: Build
        run: cmake --build --preset windows-release

      # find_package(libwebrtc REQUIRED) already fails the configure when the
      # media layer cannot be built, so this is not about the fetch breaking.
      # It is about the flag above being dropped or misspelled, which is a
      # change that builds, packages, installs, signs and publishes, and is
      # only discovered by a person who downloaded the result and tried to
      # talk. The sentence looked for here exists in exactly one translation
      # unit, and only when the stub is compiled in.
      - name: Check the media layer is in the binary
        shell: pwsh
        run: |
          $exe = 'build/windows-release/bin/partyshare.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($text.Contains('built without libwebrtc')) {
            throw 'this build carries the media stub, so it cannot send or receive audio'
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "media layer present, partyshare.exe is $mb MB"

      - name: Stage the install tree
        shell: bash
        run: cmake --install build/windows-release --prefix "$PWD/stage"

      # windeployqt is the Windows half of what linuxdeploy's Qt plugin does on
      # Linux: it copies the Qt libraries and the platform plugin next to the
      # executable, which is where a Windows program looks for them.
      - name: Bundle the Qt runtime
        shell: bash
        run: windeployqt --release --no-translations stage/bin/partyshare.exe

      # Every binary, not only the executables. Smart App Control checks each
      # file as it is loaded, so one unsigned DLL beside a signed program is
      # still a program that does not start. The first install of this MSI on a
      # machine with Smart App Control on failed at datachannel.dll, with the
      # executable already written: of the thirty files in the install tree,
      # twenty-two arrive signed by Microsoft or by Qt and eight do not, and
      # seven of those eight are libraries this glob never reached.
      #
      # The ones that already carry a signature are skipped rather than
      # re-signed, because replacing a publisher's identity with ours says
      # something untrue about who built them.
      #
      # Smart App Control also only accepts a certificate from a CA in the
      # Microsoft Trusted Root Program, and only RSA - it does not read ECC
      # signatures at all. A self-signed certificate here produces artefacts
      # that are signed and still blocked.
      - name: Sign the executables
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          try {
            $unsigned = Get-ChildItem stage\bin -Recurse -Include *.exe, *.dll |
              Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
            foreach ($file in $unsigned) {
              signtool sign /f "$env:RUNNER_TEMP\cert.pfx" `
                /p $env:WINDOWS_CERTIFICATE_PASSWORD `
                /tr http://timestamp.digicert.com /td sha256 /fd sha256 $file.FullName
              # A native program that fails does not stop a pwsh step on its
              # own, and the last statement here used to be the one deleting
              # the certificate. A signing run that signed nothing would have
              # published exactly like one that worked.
              if ($LASTEXITCODE -ne 0) {
                throw "signtool failed on $($file.Name), exit code $LASTEXITCODE"
              }
            }
            Write-Host "signed $($unsigned.Count) file(s)"

            # The invariant, checked rather than assumed: nothing leaves this
            # job unsigned.
            $left = Get-ChildItem stage\bin -Recurse -Include *.exe, *.dll |
              Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
            if ($left) {
              throw "still unsigned after signing: $($left.Name -join ', ')"
            }
          } finally {
            Remove-Item "$env:RUNNER_TEMP\cert.pfx" -ErrorAction SilentlyContinue
          }

      # CPack packages the install tree that CMake describes, not the staged
      # directory above, so the Qt runtime windeployqt just copied has to be
      # part of what gets installed. Pointing the staging directory at it is
      # what puts the DLLs inside the installer instead of beside it.
      # pwsh rather than bash, because $PWD in a bash step on a Windows runner is
      # an MSYS path, /d/a/PartyShare/PartyShare. MSYS rewrites those to native
      # paths on the way into a native program, but it leaves an argument
      # containing a semicolon alone, taking it for a Windows path list that has
      # already been converted. CPACK_INSTALLED_DIRECTORIES is exactly such an
      # argument, so the first MSI this repository built was handed a directory
      # that does not exist on Windows, found nothing in it, and shipped without
      # the Qt runtime windeployqt had just staged.
      #
      # CPACK_INSTALL_CMAKE_PROJECTS is emptied because CPACK_INSTALLED_DIRECTORIES
      # adds to it rather than replacing it, and the second source is what made
      # the first failure survive review. CPack does not fail on a staging
      # directory it cannot find - it reports the path, packages nothing from it
      # and exits 0 - so with the project's own install rules also running, the
      # MSI came out carrying the executable they produce and none of the Qt
      # runtime, which is a package that looks right until someone runs it. With
      # the staged tree as the only source, the same mistake produces an empty
      # package, and the install check below is what turns that into a red job.
      - name: Build the installer
        shell: pwsh
        run: |
          $stage = "$PWD/stage".Replace('\', '/')
          cpack --config build/windows-release/CPackConfig.cmake `
            -B build/windows-release/package `
            -D CPACK_INSTALLED_DIRECTORIES="$stage;." `
            -D CPACK_INSTALL_CMAKE_PROJECTS=
          if ($LASTEXITCODE -ne 0) { throw "cpack failed with $LASTEXITCODE" }

      # An installer nobody installed is a guess. This is the Windows half of
      # what the AppImage smoke test does on Linux: put the MSI through the same
      # msiexec a user's machine would, look for the executable the start menu
      # shortcut will point at, and take it away again. It does not start the
      # client - a GUI executable on Windows has no console to report itself
      # ready to - so it proves the package installs, not that it runs.
      - name: Install the MSI
        shell: pwsh
        run: |
          # -ErrorAction, because an Actions pwsh step stops on the first error
          # and a pattern that matches nothing is one: without it the step dies
          # on the wildcard and never reaches the sentence explaining what is
          # actually missing.
          $package = 'build\windows-release\package'
          $msi = Get-ChildItem "$package\partyshare-*.msi" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $msi) { throw 'the WIX generator produced no .msi' }
          if (-not (Get-ChildItem "$package\partyshare-*.zip" -ErrorAction SilentlyContinue)) {
            throw 'the ZIP generator produced no .zip'
          }

          $log = "$env:RUNNER_TEMP\install.log"
          $run = Start-Process msiexec -Wait -PassThru -ArgumentList `
            '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$log`""
          # 3010 is "installed, wants a reboot", which is a success on a machine
          # that is about to be thrown away.
          if ($run.ExitCode -notin 0, 3010) {
            Get-Content $log -Tail 60
            throw "msiexec refused the package, exit code $($run.ExitCode)"
          }

          $root = 'C:\Program Files\PartyShare'
          $exe = "$root\bin\partyshare.exe"
          if (-not (Test-Path $exe)) {
            Write-Host 'what the MSI actually installed:'
            Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "$exe is not there after an install that reported success"
          }
          # The Qt platform plugin, which is the one file whose absence turns
          # into "this application failed to start" on the user's machine and
          # into nothing at all here.
          if (-not (Test-Path "$root\bin\platforms\qwindows.dll")) {
            throw 'windeployqt output did not reach the installer'
          }

          # And the libraries that are neither Qt nor ours. windeployqt does not
          # know about them and, until the install rule in client/CMakeLists.txt
          # learned to carry a runtime dependency set, nothing did: the first MSI
          # this repository built held the executable and the whole Qt runtime
          # and none of these, which is a package that passes both checks above
          # and installs a program that cannot start. Named one by one rather
          # than counted, for the same reason the Linux tree is.
          foreach ($dll in 'spdlog.dll', 'fmt.dll', 'datachannel.dll',
                           'libcrypto-3-x64.dll', 'libssl-3-x64.dll',
                           'srtp2.dll', 'juice.dll') {
            if (-not (Test-Path "$root\bin\$dll")) {
              throw "$dll is missing from the install tree, so the client cannot start"
            }
          }

          Start-Process msiexec -Wait -ArgumentList `
            '/x', "`"$($msi.FullName)`"", '/qn', '/norestart'

      # The file a person downloads is the MSI, and it is the file SmartScreen
      # judges. Signing only the executables inside it leaves the warning on the
      # one thing the user is asked to trust first.
      - name: Sign the installer
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          Get-ChildItem build\windows-release\package\partyshare-*.msi | ForEach-Object {
            signtool sign /f "$env:RUNNER_TEMP\cert.pfx" `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/windows-release/package/partyshare-*.msi
            build/windows-release/package/partyshare-*.zip
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            preset: macos-arm64-release
          # arm64 only for now. The Intel entry is left here, commented, because
          # the job is fine and the build is not: on that runner Homebrew lives
          # in /usr/local, which is on the default include path, so its OpenSSL
          # headers reach the compiler ahead of the ones vcpkg passes with
          # -isystem, and -Wold-style-cast -Werror kills the build inside
          # safestack.h. On Apple Silicon Homebrew is in /opt/homebrew, off that
          # path, which is the whole reason arm64 builds and x64 does not.
          #
          #  - arch: x64
          #    # The Intel runner, which is a named variant rather than an old
          #    # version: macos-13 was the last plain-numbered x86_64 image and
          #    # it is gone. Apple Silicon runners cannot build an x64 artefact.
          #    runner: macos-15-intel
          #    preset: macos-x64-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true

      - name: Prepare vcpkg
        run: scripts/ci_vcpkg.sh
        shell: bash

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_TOOLCHAIN_FILE="$DV_VCPKG_TOOLCHAIN"
          -DDV_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The example configuration has to be carried into the bundle by hand.
      # install(FILES) puts it under share/doc, which is right for a Unix
      # prefix and is not somewhere a .dmg looks: the image is built from
      # stage/partyshare.app alone, so on macOS the file was installed and then
      # left behind. Whoever installed from the .dmg got no example and no
      # pointer to where the client reads a config.ini from.
      #
      # Copied from the install tree rather than from assets/, so it stays the
      # file the install rule chose.
      - name: Stage the bundle
        run: |
          set -euo pipefail
          cmake --install build/${{ matrix.preset }} --prefix "$PWD/stage"
          cp stage/share/doc/partyshare/config.example.ini \
             stage/partyshare.app/Contents/Resources/

      - name: Bundle the Qt runtime
        run: macdeployqt stage/partyshare.app -always-overwrite

      # macdeployqt exits 0 after printing "ERROR: Cannot resolve rpath", so
      # what it could not finish has to be found here rather than trusted.
      #
      # It copies every plugin of a category it decides to deploy, including
      # ones whose framework is not installed: an iconengine that needs QtSvg,
      # an imageformat that needs QtPdf, an input context that needs
      # QtVirtualKeyboard. None of the three can load, all three fail silently
      # at runtime, and all three are dead weight signed and shipped as if they
      # worked. A plugin is judged by whether its dependencies are in the
      # bundle, not by name, so a future Qt that moves one of them is caught
      # too.
      #
      # The install names are the second half. macdeployqt rewrites what a
      # binary depends on and sometimes leaves a copied dylib carrying its
      # original absolute id, which is a path to a Homebrew that only exists on
      # the builder.
      - name: Make the bundle self-contained
        run: |
          set -euo pipefail
          app=stage/partyshare.app
          frameworks="$app/Contents/Frameworks"

          removed=0
          while IFS= read -r plugin; do
            missing=""
            while IFS= read -r dep; do
              name="${dep#@rpath/}"
              [[ -e "$frameworks/$name" ]] || missing="$missing $name"
            done < <(otool -L "$plugin" | awk '/@rpath\//{print $1}')
            if [[ -n "$missing" ]]; then
              echo "removing $(basename "$plugin"), cannot resolve:$missing"
              rm -f "$plugin"
              removed=$((removed + 1))
            fi
          done < <(find "$app/Contents/PlugIns" -name '*.dylib')
          echo "plugins removed: $removed"

          # Driven by find rather than by a glob because a bundle with no
          # loose dylib is normal, not an error: where Qt comes from an
          # installer instead of from Homebrew, macdeployqt copies .framework
          # bundles and nothing else, the glob matches nothing, stays literal,
          # and otool is handed a path with a star in it. The id is built from
          # the path under Frameworks so a dylib in a subdirectory keeps an id
          # that still resolves.
          while IFS= read -r lib; do
            id="$(otool -D "$lib" | tail -1)"
            case "$id" in
              /opt/homebrew/*|/usr/local/*)
                rel="${lib#"$frameworks"/}"
                echo "rewriting id of $rel: $id"
                install_name_tool -id "@executable_path/../Frameworks/$rel" "$lib"
                ;;
            esac
          done < <(find "$frameworks" -type f -name '*.dylib' 2>/dev/null)

          # Nothing may point outside the bundle. A path that survives here is
          # one that resolves on this runner and on no other machine, which is
          # the failure that only shows up after the artefact is published.
          leaked="$(find "$app" -type f \( -perm -u+x -o -name '*.dylib' \) -print0 |
            xargs -0 -n1 otool -L 2>/dev/null |
            grep -oE '(/opt/homebrew|/usr/local)[^ ]*' | sort -u || true)"
          if [[ -n "$leaked" ]]; then
            echo "$leaked"
            echo "the bundle still references paths outside itself" >&2
            exit 1
          fi

      # Notarisation is not signing: Apple wants the bundle signed with a
      # Developer ID, then uploaded and stapled, and a bundle that skips any of
      # the three is one Gatekeeper refuses to open on a machine that did not
      # build it.
      - name: Sign and notarise
        if: env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions \
            "$RUNNER_TEMP/build.keychain"
          rm "$RUNNER_TEMP/cert.p12"

          codesign --deep --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" stage/partyshare.app

          ditto -c -k --keepParent stage/partyshare.app "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple stage/partyshare.app

      # What a person sees when the image mounts: the application, and the
      # Applications folder to drag it into. The symlink is the whole convention
      # on macOS, and an image without it is one where the only thing to do is
      # run the app from the disk image, which leaves it running from a mount
      # that disappears.
      - name: Build the disk image
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          rm -rf dmg && mkdir -p dmg
          cp -R stage/partyshare.app dmg/
          ln -s /Applications dmg/Applications

          # Beside the application, where it is read before anything is
          # installed. The copy inside Contents/Resources is the one that
          # survives the drag; this one is the one that gets noticed.
          cp stage/share/doc/partyshare/config.example.ini dmg/

          # The icon the mounted volume itself gets in the Finder sidebar. It
          # needs the file, the custom icon attribute, and the directory marked
          # as having one: any of the three missing and it falls back to the
          # generic disk.
          cp assets/partyshare.icns dmg/.VolumeIcon.icns
          SetFile -a C dmg || true

          hdiutil create -volname PartyShare -srcfolder dmg -ov -format UDZO \
            "partyshare-${VERSION}-macos-${{ matrix.arch }}.dmg"

      # Gatekeeper judges the disk image as well as the bundle inside it, so an
      # unsigned image carrying a signed application still warns on first open.
      - name: Sign the disk image
        if: env.MACOS_CERTIFICATE != ''
        run: codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" partyshare-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: partyshare-*.dmg
          retention-days: 7

  publish:
    name: Publish
    # Only the platforms that produced something. A macOS job that fails must
    # not hold back a Windows artefact that is already built and installed:
    # partial is a worse release than complete and a much better one than none.
    needs: [windows, macos]
    # always(), because a plain needs: skips this job when either of the two
    # fails, which is the opposite of what the paragraph above asks for. The
    # floor used to be the Linux result, on the grounds that it is the only
    # artefact this repository can verify end to end; with that job off, the
    # floor is that at least one platform produced something, because a release
    # with nothing in it is not a release.
    # On one line and without ${{ }}: an if: is already an expression, and a
    # folded block leaves a trailing newline that makes the whole thing a
    # non-empty string, which is true. That version published on every push.
    if: always() && startsWith(github.ref, 'refs/tags/v') && (needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          find artifacts -type f ! -name '*.zsync' -exec sha256sum {} + \
            | sed 's| artifacts/[^/]*/| |' > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: false
