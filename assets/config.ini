; PartyShare - configuracao do cliente
;
; Este arquivo ja vale como esta. Nao precisa renomear nada: tudo aqui esta
; comentado, entao o cliente sobe nos padroes de fabrica ate alguem tirar um
; ponto e virgula.
;
; O cliente procura dois arquivos, sozinho, e nenhum precisa existir:
;
;   1. config.ini ao lado do partyshare.exe
;      Vale para todos os usuarios da maquina. Editar exige administrador,
;      porque C:\Program Files e protegida pelo Windows. E este arquivo que o
;      instalador escreve, e e este que ele substitui na proxima atualizacao:
;      o que voce mudar aqui, anote em algum lugar.
;
;   2. config.ini em %LOCALAPPDATA%\partyshare\
;      So do seu usuario, nao pede administrador, e ganha do de cima. O cliente
;      cria este arquivo na primeira vez que sobe, e o instalador nunca encosta
;      nele. E aqui que a tela de Configuracoes grava o microfone e a saida de
;      som que voce escolher.
;
; No Linux o segundo e ~/.config/partyshare/config.ini, e no macOS
; ~/Library/Application Support/partyshare/config.ini. No macOS o primeiro esta
; dentro do .app, que e assinado: mexer nele quebra a assinatura, entao use o
; segundo.
;
; Depois vem DV_SIGNALING_URL e afins no ambiente, e por ultimo as opcoes de
; linha de comando. O log do cliente diz, na subida, quais desses arquivos ele
; leu e quais nao encontrou.
;
; Comentarios comecam com ; ou #. Uma chave que o cliente nao conhece e um
; erro na subida, com o numero da linha, em vez de uma linha que nao faz nada.

[network]

; Onde esta o servidor. E a unica linha que a maioria das instalacoes muda.
; O padrao e ws://127.0.0.1:8080, que so serve para servidor na propria maquina.
; signaling_url = ws://192.168.1.10:8080

; Servidores STUN, separados por virgula. O padrao ja traz o do Google.
; Numa rede local fechada, sem saida para a internet, pode deixar vazio.
; stun_servers = stun:stun.l.google.com:19302

; TURN, se a rede tiver NAT que o STUN nao atravessa. Raro numa LAN.
; turn_url = turn:turn.example.com:3478
; turn_username = usuario
; turn_password = senha

[video]

; A tela compartilhada. O padrao e 1280x720 a 30 quadros.
; fps = 30

; A faixa de bitrate do compartilhamento, em kbps. A tela de Configuracoes
; escreve estas duas linhas sozinha, no config.ini do seu usuario, quando voce
; mexe nos dois campos.
;
; min e onde o codificador comeca e o que ele busca num link saudavel; max e o
; teto. floor e o minimo absoluto ate onde o controle de congestionamento pode
; espremer a imagem quando o link nao aguenta o min, e ele nao pode ficar acima
; do min: se voce baixar o min abaixo de 300, baixe o floor junto, senao o
; cliente recusa subir dizendo qual das duas linhas esta errada.
; Com auto_bitrate = true o min e o max sao calculados a partir da resolucao e
; do fps acima, e as duas linhas seguintes passam a ser so o registro do que o
; calculo deu na ultima vez. E a caixa "Bitrate" da tela de Configuracoes que
; liga isso. Comeca desligado de proposito: um arquivo que ja tem um bitrate
; escrito tem por um motivo, e as vezes o motivo e um link que nao aguenta mais.
; auto_bitrate = false
; min_bitrate_kbps = 1500
; max_bitrate_kbps = 3000
; floor_bitrate_kbps = 300

[audio]

; Vazio significa o dispositivo padrao do sistema.
;
; A tela de Configuracoes escreve estas duas linhas sozinha, no config.ini do
; seu usuario, assim que voce troca de microfone ou de saida. Mexer aqui na mao
; funciona igual; o nome tem que ser o que o sistema mostra.
; input_device = Microfone (Realtek)
; output_device = Fones de ouvido

; A supressao de ruido do microfone, ligada por padrao.
;
; Ela e afinada para uma coisa so - uma voz numa sala - e trata todo o resto
; como sendo a sala: um instrumento, um disco tocando atras de voce, um chiado
; que na verdade era parte do que voce queria mandar. Se o seu microfone e para
; carregar mais do que fala, desligue.
;
; A caixa "Remove background noise from the microphone" na tela de Configuracoes
; escreve esta linha sozinha, e vale na hora, inclusive no meio de uma chamada.
; noise_suppression = true

; As outras duas do mesmo modulo, tambem ligadas por padrao. Nao aparecem na
; tela de Configuracoes; so aqui.
;
; O cancelador de eco e o que impede a voz dos outros de voltar pelo seu
; microfone. Desligar so faz sentido com fones, e nem sempre.
; echo_cancellation = true
;
; O controle automatico de ganho iguala o volume da sua voz. Desligar deixa a
; sua voz do tamanho que o microfone captou, o que e melhor para instrumento e
; pior para conversa. Ligado, e o controlador de segunda geracao do libwebrtc:
; mexe no volume do microfone do sistema e soma um ganho digital que so se move
; com fala e para num piso de ruido, em vez de subir o chiado junto.
; automatic_gain_control = true

[screen_audio]

; O que o compartilhamento de tela leva alem da imagem.
;
;   none      so a imagem, que e como era antes desta opcao existir
;   system    tudo o que a maquina toca, menos o proprio PartyShare
;   process   um aplicativo so, escolhido na tela de Configuracoes
;
; O padrao e system. A exclusao do proprio PartyShare no modo system nao e um
; detalhe: sem ela, a voz dos outros participantes sai pelos alto-falantes,
; volta pela captura e e reenviada para eles depois do cancelador de eco, que
; nao tem mais o que cancelar.
;
; Precisa do Windows 10 build 20348 ou mais novo. Em Linux e macOS a captura
; ainda nao existe e a opcao nao aparece.
;
; A tela de Configuracoes escreve esta linha sozinha quando voce muda a escolha.
; mode = system

; O quao alto o som da tela sai, em porcento do que o aplicativo esta tocando.
;
; 100 e o som intocado, que e como todo compartilhamento saia antes desta linha
; existir. So o lado da tela se mexe: a sua voz fica no nivel em que esta, que
; ja tem um controle de ganho proprio antes deste.
;
; Vale de 0 a 200. Acima de 100 e reforco, para o caso de um aplicativo tocando
; baixo demais; o som grampeia em vez de dar a volta, entao o pior que acontece
; e soar mal. Meio no slider e metade da amplitude, nao "metade do que se ouve":
; a escala e uma razao entre duas fontes, nao uma sensacao.
;
; Isto vale para a sala inteira. O som viaja dentro da sua trilha de voz, entao
; quando chega do outro lado ja foi codificado junto com ela e ninguem consegue
; separar os dois de novo. Baixar aqui baixa para todos.
;
; O slider "Shared volume" na tela de Configuracoes escreve esta linha sozinha.
; volume_percent = 100

[ui]

; O som curto quando alguem entra ou sai da sala.
;
; Sobe quando entra, desce quando sai. Toca com a janela em foco ou nao, porque
; e um aviso da sala e nao sobre ela: quem mais precisa dele e quem esta olhando
; uma tela compartilhada com a lista de participantes fora de vista.
;
; Ligado por padrao. Desligue se voce atende chamadas numa sala aberta.
;
; A tela de Configuracoes escreve esta linha sozinha quando voce muda a escolha.
; room_sounds = true

; Se o cliente pergunta ao GitHub, de vez em quando, se ja saiu uma versao mais
; nova que a dele.
;
; Ligado por padrao. E uma consulta so, a um endereco so, levando nada alem do
; numero de versao que ja esta escrito no rodape da janela. Nada e baixado e
; nada e instalado: o resultado, quando existe, e uma linha no rodape dizendo
; "0.1.42 available", com link para a pagina de download. Quem atualiza e voce.
;
; Desligue se a maquina nao tem saida para a internet - ai cada consulta e so
; um timeout - ou se a rede nao deve conversar com o lado de fora. Desligado,
; nenhuma consulta e feita.
;
; A caixa "Check GitHub for new versions", no grupo Connection da tela de
; Configuracoes, escreve esta linha sozinha.
; check_for_updates = true

[logging]

; trace, debug, info, warn, error, fatal ou off.
; Suba para debug quando precisar descobrir por que a conexao nao acontece.
; level = info

; Um arquivo de log alem do console.
; file_path = C:/Users/Publico/partyshare.log
